# IdeaForge — local Docker stack: Postgres + Redis + FastAPI backend + Vite frontend.
#
#   docker compose up --build
#   Frontend:  http://localhost:9001
#   Backend:   http://localhost:9000  (health: /api/v1/health, docs: /docs)
#
# The backend reuses YOUR authenticated Claude session by bind-mounting
# ~/.claude and ~/.claude.json (see the backend `volumes`). It runs as UID 1001
# to match the host so those creds — and the bind-mounted source — are usable,
# and so the Claude CLI permits --dangerously-skip-permissions (it refuses as root).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tuition
      POSTGRES_PASSWORD: tuition
      POSTGRES_DB: ideaforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "9002:5432"          # optional: inspect the DB from the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuition -d ideaforge"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env       # GEMINI/TAVILY/JWT secrets, etc.
    environment:
      # Override the host-specific URLs from .env with in-network addresses:
      DATABASE_URL: postgresql+asyncpg://tuition:tuition@db:5432/ideaforge
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: '["http://localhost:9001"]'
      HOME: /home/app
      # Alternative to mounting creds: uncomment and set to use an API key instead.
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./backend:/app                              # live code (hot reload) + logs/ + projects/ persist on host
      - ${HOME}/.claude:/home/app/.claude           # reuse your authenticated Claude session
      - ${HOME}/.claude.json:/home/app/.claude.json
    ports:
      - "9000:8000"
      - "9003-9005:8100-8102"   # generated child apps (preview) — see caveat in the guide
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # --reload-dir scopes hot-reload to the source package only. Without it the
    # watcher also watches logs/ and projects/ (both written at runtime), which
    # creates a change->log->change feedback loop that pegs the CPU.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:9000   # browser (on host) -> published backend port
    volumes:
      - ./frontend:/app
      - /app/node_modules                   # keep the image's linux node_modules, not the host's
    ports:
      - "9001:5173"          # browser loads the app from http://localhost:9001
    depends_on:
      - backend

volumes:
  pgdata:
